<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"/>
<title>Đang xử lý đăng nhập...</title>
<style>
  body {
    margin: 0;
    background: #0a0e1a;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    font: 14px/1.4 system-ui, sans-serif;
    color: #9fb3d1;
  }
  .spinner {
    width: 28px; height: 28px;
    border: 3px solid #1f2a44;
    border-top-color: #4f8cff;
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
    margin-right: 12px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="spinner"></div>
  <span>Đang hoàn tất đăng nhập...</span>
  <script>
    (function() {
      try {
        // Parse fragment: #id_token=...&access_token=...
        var hash = window.location.hash.replace(/^#/, '')
                || window.location.search.replace(/^\?/, '');
        var result = {};
        hash.split('&').forEach(function(part) {
          var eq = part.indexOf('=');
          if (eq > -1) {
            var k = decodeURIComponent(part.slice(0, eq));
            var v = decodeURIComponent(part.slice(eq + 1));
            result[k] = v;
          }
        });

        // Gửi kết quả về parent window qua postMessage
        if (window.opener && !window.opener.closed) {
          window.opener.postMessage({
            type: 'GOOGLE_OAUTH_RESULT',
            id_token: result.id_token || null,
            access_token: result.access_token || null,
            error: result.error || null,
          }, window.location.origin);
        }
      } catch(e) {
        // Gửi lỗi về parent
        try {
          if (window.opener && !window.opener.closed) {
            window.opener.postMessage({
              type: 'GOOGLE_OAUTH_RESULT',
              id_token: null,
              error: 'callback_parse_error'
            }, window.location.origin);
          }
        } catch(e2) {}
      } finally {
        // Tự đóng sau 500ms
        setTimeout(function() { window.close(); }, 500);
      }
    })();
  </script>
</body>
</html>
