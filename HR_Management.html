// AUTO-LOGIN KHI PAGE LOAD
// ============================================================
window.addEventListener('DOMContentLoaded', function() {
  // Kiểm tra localStorage xem có session lưu không
  const savedSession = localStorage.getItem("sb_session");
  const guestMode = localStorage.getItem("guest_mode");

  if (savedSession) {
    try {
      _session = JSON.parse(savedSession);
      if (_session?.access_token) {
        // Có session → auto-login với đúng role
        if (_isAdminEmail(_session.user?.email)) {
          startApp("admin");
        } else {
          startApp("user");
        }
      } else {
        // Session không hợp lệ → show login
        document.getElementById("login-screen").style.display = "flex";
        document.getElementById("app").style.display = "none";
      }
    } catch(e) {
      console.error("Error loading session:", e);
      localStorage.removeItem("sb_session");
      document.getElementById("login-screen").style.display = "flex";
      document.getElementById("app").style.display = "none";
    }
  } else if (guestMode === "1") {
    // Người dùng đã chọn "Vào xem (Chỉ đọc)" → khôi phục chế độ đó
    startApp("user");
  } else {
    // Không có session, không phải guest → show login
    document.getElementById("login-screen").style.display = "flex";
    document.getElementById("app").style.display = "none";
  }
});

/* ── Avatar particle burst on tap ── */
(function(){
  const COLORS = {
    'av-blue':   ['#60a5fa','#93c5fd','#7c3aed'],
    'av-purple': ['#a78bfa','#c4b5fd','#f472b6'],
    'av-green':  ['#34d399','#6ee7b7','#0ea5e9'],
    'av-orange': ['#fbbf24','#fcd34d','#f87171'],
    'av-pink':   ['#f472b6','#f9a8d4','#a78bfa'],
    'av-teal':   ['#2dd4bf','#5eead4','#38bdf8'],
  };
  function burst(avatar, e) {
    const cls = [...avatar.classList].find(c => c.startsWith('av-'));
    const palette = COLORS[cls] || ['#60a5fa','#a78bfa','#34d399'];
    const rect = avatar.getBoundingClientRect();
    const cx = rect.left + rect.width/2;
    const cy = rect.top  + rect.height/2;
    const count = 10;
    for (let i = 0; i < count; i++) {
      const angle = (i / count) * Math.PI * 2 + (Math.random() - 0.5) * 0.6;
      const dist  = 22 + Math.random() * 18;
      const size  = 4 + Math.random() * 4;
      const color = palette[i % palette.length];
      const el = document.createElement('div');
      el.style.cssText = `
        position:fixed; left:${cx}px; top:${cy}px;
        width:${size}px; height:${size}px; border-radius:50%;
        background:${color};
        box-shadow: 0 0 ${size*2}px ${color};
        pointer-events:none; z-index:9999;
        transform:translate(-50%,-50%) scale(1);
        transition: transform 0.5s cubic-bezier(0.22,1,0.36,1),
                    opacity   0.5s ease;
        will-change: transform, opacity;
      `;
      document.body.appendChild(el);
      requestAnimationFrame(() => requestAnimationFrame(() => {
        el.style.transform = `translate(calc(-50% + ${Math.cos(angle)*dist}px), calc(-50% + ${Math.sin(angle)*dist}px)) scale(0)`;
        el.style.opacity = '0';
      }));
      setTimeout(() => el.remove(), 520);
    }
    /* ripple on avatar itself */
    const rip = document.createElement('div');
    rip.style.cssText = `
      position:absolute; inset:-3px; border-radius:19px;
      background: radial-gradient(circle, rgba(255,255,255,0.35) 0%, transparent 70%);
      pointer-events:none; z-index:4;
      animation: avRipple 0.5s ease forwards;
    `;
    avatar.appendChild(rip);
    setTimeout(() => rip.remove(), 500);
  }

  /* inject ripple keyframes once */
  const st = document.createElement('style');
  st.textContent = `
    @keyframes avRipple {
      from { opacity:1; transform:scale(0.6); }
      to   { opacity:0; transform:scale(1.8); }
    }
  `;
  document.head.appendChild(st);

  /* attach listeners after list renders (event delegation) */
  document.addEventListener('click', e => {
    const av = e.target.closest('.emp-avatar');
    if (av) burst(av, e);
    const di = e.target.closest('.dev-icon');
    if (di) devBurst(di, e);
  });
})();

/* ── Dev-icon particle burst ── */
(function(){
  const PALETTES = {
    'di-inused':  ['#60a5fa','#93c5fd','#a78bfa','#818cf8'],
    'di-backup':  ['#fbbf24','#fcd34d','#f97316','#fb923c'],

    const rect = icon.getBoundingClientRect();

        el.style.opacity='0';
      }));
      setTimeout(()=>el.remove(), 530);
    }
    /* ripple flash on icon */
    const rip = document.createElement('div');
    rip.style.cssText = `

      animation:devRipple 0.45s ease forwards;
    `;
    icon.appendChild(rip);
    setTimeout(()=>rip.remove(), 460);
  }
  const st = document.createElement('style');
  st.textContent = `@keyframes devRipple{from{opacity:1;transform:scale(0.5)}to{opacity:0;transform:scale(1.9)}}`;
  document.head.appendChild(st);
})();
