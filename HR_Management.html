    --accent-2: #8B5CF6;
    --accent-2-bright: #A78BFA;
    --accent-cyan: #06B6D4;
    --success: #10B981;
    --success-bright: #34D399;
    --danger: #EF4444;
    --danger-bright: #F87171;
    --warning: #F59E0B;
    --warning-bright: #FCD34D;
    --text-primary: rgba(255,255,255,0.96);
    --text-secondary: rgba(255,255,255,0.58);
    --text-tertiary: rgba(255,255,255,0.30);
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --safe-left: env(safe-area-inset-left, 0px);
    --safe-right: env(safe-area-inset-right, 0px);
    --nav-bottom-gap: max(16px, calc(12px + env(safe-area-inset-bottom, 0px)));
  }

  /* ───────── Fallback safe-area UNIVERSAL cho mọi iPhone khi add shortcut ─────────
     Dùng display-mode: standalone để đảm bảo khi mở từ Home Screen LUÔN có
     padding tránh tai thỏ / Dynamic Island / status bar / home indicator,
     bất kể env(safe-area-inset-*) có trả về giá trị hay không. */
  @media (display-mode: standalone), (display-mode: fullscreen) {
    :root {
      --safe-top: max(env(safe-area-inset-top, 0px), 59px);
      --safe-bottom: max(env(safe-area-inset-bottom, 0px), 34px);
      --safe-left: max(env(safe-area-inset-left, 0px), 0px);
      --safe-right: max(env(safe-area-inset-right, 0px), 0px);
    }
  }
  /* iOS Safari standalone (cờ riêng của Apple, vẫn cần phòng hờ) */
  @supports (-webkit-touch-callout: none) {
    @media (display-mode: standalone), (display-mode: fullscreen) {
      :root {
        --safe-top: max(env(safe-area-inset-top, 0px), 59px);
        --safe-bottom: max(env(safe-area-inset-bottom, 0px), 34px);
      }
    }
  }
  /* Landscape: tai thỏ chuyển sang trái/phải → cần safe-left/right ≥ 44px */
  @media (orientation: landscape) and (max-device-height: 500px) {
    :root {
      --safe-left: max(env(safe-area-inset-left, 0px), 44px);
      --safe-right: max(env(safe-area-inset-right, 0px), 44px);
      --safe-top: max(env(safe-area-inset-top, 0px), 0px);
      --safe-bottom: max(env(safe-area-inset-bottom, 0px), 21px);
    }
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }
  /* Prevent iOS auto-zoom on input focus */
  input, select, textarea { font-size: 16px !important; }
  html, body { height: 100%; height: 100dvh; overflow: hidden; }
  body {
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg-base);
    color: var(--text-primary);
    min-height: 100vh;
    position: relative;
  }

  /* ── Animated aurora background ── */
  #aurora-canvas {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    opacity: 0.65;
  }

  /* Grain overlay */
  body::after {
    content: '';
    position: fixed; inset: 0; z-index: 0;
    background: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
    opacity: 0.6; pointer-events: none;
  }

  /* ── Animated orbs ── */
  .orb {
    position: fixed; border-radius: 50%; pointer-events: none; z-index: 0;
    filter: blur(80px); opacity: 0;
    animation: orbFloat linear infinite;
  }
  .orb-1 {
    width: 500px; height: 500px;
    background: radial-gradient(circle, rgba(59,130,246,0.22) 0%, transparent 70%);
    top: -100px; left: -100px;
    animation-duration: 20s; animation-delay: 0s;
    animation-name: orb1; opacity: 1;
  }
  .orb-2 {
    width: 400px; height: 400px;
    background: radial-gradient(circle, rgba(139,92,246,0.18) 0%, transparent 70%);
    bottom: -80px; right: -80px;
    animation-duration: 25s; animation-delay: -8s;
    animation-name: orb2; opacity: 1;
  }
  .orb-3 {
    width: 300px; height: 300px;
    background: radial-gradient(circle, rgba(6,182,212,0.12) 0%, transparent 70%);
    top: 40%; left: 50%;
    animation-duration: 18s; animation-delay: -4s;
    animation-name: orb3; opacity: 1;
  }
  @keyframes orb1 {
    0%,100% { transform: translate(0,0) scale(1); }
    33% { transform: translate(80px, 60px) scale(1.1); }
    66% { transform: translate(-40px, 100px) scale(0.9); }
  }
  @keyframes orb2 {
    0%,100% { transform: translate(0,0) scale(1); }
    40% { transform: translate(-100px,-60px) scale(1.15); }
    70% { transform: translate(50px,-100px) scale(0.85); }
  }
  @keyframes orb3 {
    0%,100% { transform: translate(-50%,-50%) scale(1); }
    50% { transform: translate(calc(-50% + 80px),calc(-50% - 60px)) scale(1.2); }
  }

  /* Glass utility */
  .glass {
    background: var(--glass-bg);
    backdrop-filter: var(--blur);
    -webkit-backdrop-filter: var(--blur);
    border: 1px solid var(--glass-border);
    box-shadow: var(--glass-shadow);
  }
  .glass-strong {
    background: var(--glass-bg-strong);
    backdrop-filter: var(--blur);
    -webkit-backdrop-filter: var(--blur);
    border: 1px solid var(--glass-border-strong);
    box-shadow: var(--glass-shadow-lg);
  }
  .glass-card {
    background: rgba(255,255,255,0.045);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border: 1px solid rgba(255,255,255,0.09);
    border-radius: 16px;
    transition: all 0.3s cubic-bezier(0.34,1.56,0.64,1);
    position: relative; overflow: hidden;
  }
  .glass-card::before {
    content: ''; position: absolute; inset: 0; border-radius: inherit;
    background: linear-gradient(135deg, rgba(255,255,255,0.06) 0%, transparent 50%);
    pointer-events: none;
  }
  .glass-card:hover {
    background: rgba(255,255,255,0.08);
    border-color: rgba(59,130,246,0.25);
    transform: translateY(-2px) scale(1.005);
    box-shadow: 0 20px 50px rgba(0,0,0,0.4), 0 0 0 1px rgba(59,130,246,0.15);
  }

  /* Layout */
  #app { position: relative; z-index: 1; height: 100vh; height: 100dvh; display: flex; flex-direction: column; padding-left: var(--safe-left); padding-right: var(--safe-right); }

  /* Topbar */
  #topbar {
    padding: calc(14px + var(--safe-top)) calc(20px + var(--safe-right)) 14px calc(20px + var(--safe-left));
    display: flex; align-items: center; gap: 12px;
    background: rgba(6,6,16,0.75);
    backdrop-filter: blur(48px) saturate(1.6);
    -webkit-backdrop-filter: blur(48px) saturate(1.6);
    border-bottom: 1px solid rgba(255,255,255,0.07);
    flex-shrink: 0; z-index: 100;
    animation: slideDown 0.5s cubic-bezier(0.34,1.56,0.64,1);
  }
  @keyframes slideDown {
    from { transform: translateY(-100%); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
  .brand-pill {
    display: flex; align-items: center; gap: 10px;
    background: rgba(59,130,246,0.12);
    border: 1px solid rgba(59,130,246,0.25);
    border-radius: 22px; padding: 5px 14px 5px 6px;
    backdrop-filter: blur(12px);
    transition: all 0.3s ease;
    position: relative; overflow: hidden;
  }
  .brand-pill::before {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(90deg, transparent, rgba(59,130,246,0.08), transparent);
    transform: translateX(-100%);
    animation: brandShimmer 4s ease infinite;
  }
  @keyframes brandShimmer {
    0% { transform: translateX(-100%); }
    50%,100% { transform: translateX(100%); }
  }
  .brand-icon {
    width: 44px; height: 44px; border-radius: 12px;
    background: #ffffff;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 12px rgba(59,130,246,0.5), 0 0 20px rgba(59,130,246,0.2);
    flex-shrink: 0;
    animation: iconPulse 3s ease infinite;
    overflow: hidden;
  }
  .brand-icon img {
    width: 38px; height: 38px; object-fit: contain;
    image-rendering: -webkit-optimize-contrast;
    image-rendering: crisp-edges;
  }
  @keyframes iconPulse {
    0%,100% { box-shadow: 0 4px 12px rgba(59,130,246,0.5), 0 0 20px rgba(59,130,246,0.2); }
    50% { box-shadow: 0 4px 16px rgba(139,92,246,0.6), 0 0 30px rgba(139,92,246,0.3); }
  }

  /* Mobile responsive */
  @media (max-width: 768px) {
    #topbar {
      padding: 10px 12px 10px;
      gap: 8px;
    }
    .brand-pill {
      padding: 4px 10px 4px 4px;
      gap: 8px;
    }
    .brand-icon {
      width: 38px;
      height: 38px;
      box-shadow: 0 2px 8px rgba(59,130,246,0.4), 0 0 12px rgba(59,130,246,0.15);
    }
    .brand-icon img {
      width: 32px;
      height: 32px;
    }
    .brand-pill span {
      font-size: 12px;
    }
    #role-badge { display: none; }
  }

  /* Main area */
  #main { flex: 1; overflow: hidden; display: flex; flex-direction: column; }

  /* Search + filter bar */
  #toolbar {
    padding: 12px 16px;
    display: flex; gap: 8px; align-items: center; flex-shrink: 0;
    overflow-x: auto; -webkit-overflow-scrolling: touch;
  }
  #toolbar::-webkit-scrollbar { display: none; }
  .search-glass {
    flex: 1; min-width: 0;
    display: flex; align-items: center; gap: 10px;
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
    border: 1px solid rgba(255,255,255,0.09);
    border-radius: 16px; padding: 12px 16px;
    transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
    position: relative; overflow: hidden;
  }
  /* shimmer sweep on load */
  .search-glass::after {
    content: ''; position: absolute;
    top: 0; left: -100%; width: 60%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.04), transparent);
    animation: searchShimmer 2.5s ease-in-out 0.8s 1;
  }
  @keyframes searchShimmer {
    from { left: -100%; }
    to   { left: 150%; }
  }
  .search-glass:focus-within {
    background: rgba(255,255,255,0.09);
    border-color: rgba(99,102,241,0.6);
    box-shadow:
      0 0 0 3px rgba(99,102,241,0.15),
      0 0 20px rgba(99,102,241,0.15),
      0 8px 32px rgba(0,0,0,0.25);
    transform: translateY(-1px);
  }
  .search-glass:focus-within .search-icon-svg {
    color: rgba(99,102,241,0.9);
    transform: scale(1.15) rotate(-5deg);
    filter: drop-shadow(0 0 6px rgba(99,102,241,0.7));
  }
  .search-icon-svg {
    flex-shrink: 0; width: 17px; height: 17px;
    color: var(--text-tertiary);
    transition: all 0.3s cubic-bezier(0.34,1.56,0.64,1);
  }
  .search-glass input {
    flex: 1; background: none; border: none; outline: none;
    color: var(--text-primary); font-size: 15px; font-family: inherit;
    min-width: 0; letter-spacing: 0.1px;
  }
  .search-glass input::placeholder {
    color: var(--text-tertiary);
    transition: opacity 0.2s, transform 0.2s;
  }
  .search-glass:focus-within input::placeholder {
    opacity: 0.5;
  }
  .filter-pill {
    flex-shrink: 0; padding: 8px 16px; border-radius: 22px; cursor: pointer;
    font-size: 12px; font-weight: 600; transition: all 0.25s cubic-bezier(0.34,1.56,0.64,1);
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.10);
    color: var(--text-secondary); white-space: nowrap;
    -webkit-tap-highlight-color: transparent;
    position: relative; overflow: hidden;
  }
  .filter-pill::after {
    content: ''; position: absolute; inset: 0;
    background: radial-gradient(circle at center, rgba(255,255,255,0.15) 0%, transparent 60%);
    opacity: 0; transition: opacity 0.2s;
  }
  .filter-pill:active::after { opacity: 1; }
  .filter-pill:active { transform: scale(0.94); }
  .filter-pill.active {
    background: rgba(59,130,246,0.2); border-color: rgba(59,130,246,0.45);
    color: #93C5FD;
    box-shadow: 0 4px 12px rgba(59,130,246,0.2), inset 0 1px 0 rgba(255,255,255,0.1);
  }
  .filter-pill.active.success {
    background: rgba(16,185,129,0.18); border-color: rgba(16,185,129,0.4);
    color: #6EE7B7;
    box-shadow: 0 4px 12px rgba(16,185,129,0.2);
  }
  .filter-pill.active.danger {
    background: rgba(239,68,68,0.18); border-color: rgba(239,68,68,0.4);
    color: #FCA5A5;
    box-shadow: 0 4px 12px rgba(239,68,68,0.2);
  }
  .filter-pill.active.warning {
    background: rgba(245,158,11,0.18); border-color: rgba(245,158,11,0.4);
    color: #FCD34D;
    box-shadow: 0 4px 12px rgba(245,158,11,0.2);
  }

  /* Employee list */
  #list-container {
    flex: 1; overflow-y: auto; padding: 0 16px 100px;
    -webkit-overflow-scrolling: touch;
  }
  #list-container::-webkit-scrollbar { width: 4px; }
  #list-container::-webkit-scrollbar-track { background: transparent; }
  #list-container::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 2px; }

  /* Employee card */
  .emp-card {
    display: flex; align-items: center; gap: 14px;
    padding: 14px 16px; margin-bottom: 8px; cursor: pointer;
    border-radius: 18px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.08);
    transition: background 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
    -webkit-tap-highlight-color: transparent;
    position: relative; overflow: hidden;
    animation: cardIn 0.3s ease both;
    will-change: transform;
  }
  .emp-card::before {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(135deg, rgba(255,255,255,0.055) 0%, transparent 50%);
    pointer-events: none;
  }
  /* Shimmer on hover */
  .emp-card::after {
    content: ''; position: absolute; top: 0; left: -100%; width: 60%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.06), transparent);
    transition: left 0.5s ease;
    pointer-events: none;
  }
  .emp-card:hover::after { left: 150%; }
  .emp-card:hover {
    background: rgba(255,255,255,0.075);
    border-color: rgba(59,130,246,0.22);
    transform: translateY(-2px) scale(1.005);
    box-shadow: 0 12px 40px rgba(0,0,0,0.35), 0 0 0 1px rgba(59,130,246,0.12);
  }
  .emp-card:active { transform: scale(0.98); background: rgba(255,255,255,0.09); }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(12px) scale(0.97); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  /* ════════════════════════════
     EMP-AVATAR — rich animated
     ════════════════════════════ */
  .emp-avatar {
    width: 46px; height: 46px; border-radius: 16px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; font-weight: 900; letter-spacing: -0.5px;
    position: relative;
    transition: transform 0.4s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.3s ease;
    animation: avEntrance 0.55s cubic-bezier(0.34,1.56,0.64,1) both;
  }
  @keyframes avEntrance {
    0%   { opacity:0; transform: scale(0.45) rotate(-18deg); }
    55%  { opacity:1; transform: scale(1.14) rotate(5deg); }
    75%  { transform: scale(0.94) rotate(-2deg); }
    100% { opacity:1; transform: scale(1) rotate(0deg); }
  }
  /* spinning conic border — hidden until hover */
  .emp-avatar::before {
    content: '';
    position: absolute; inset: -2.5px; border-radius: 19px;
    background: var(--av-conic, conic-gradient(from 0deg, #3b82f6, #8b5cf6, #06b6d4, #3b82f6));
    z-index: -1; opacity: 0;
    transition: opacity 0.3s ease;
    animation: avBorderSpin 2.4s linear infinite paused;
  }
  @keyframes avBorderSpin { to { transform: rotate(360deg); } }
  /* glass sheen top-left */
  .emp-avatar::after {
    content: '';
    position: absolute; inset: 0; border-radius: 16px;
    background: linear-gradient(135deg, rgba(255,255,255,0.28) 0%, rgba(255,255,255,0.06) 40%, transparent 65%);
    pointer-events: none; z-index: 2;
  }
  /* initials */
  .emp-avatar span {
    position: relative; z-index: 3;
    transition: transform 0.35s cubic-bezier(0.34,1.56,0.64,1), text-shadow 0.3s ease;
  }
  /* hover */
  .emp-card:hover .emp-avatar {
    transform: scale(1.16) rotate(-8deg) translateY(-3px);
  }
  .emp-card:hover .emp-avatar::before {
    opacity: 1;
    animation-play-state: running;
  }
  .emp-card:hover .emp-avatar span {
    transform: scale(1.08);
    text-shadow: 0 0 14px currentColor;
  }
  /* press */
  .emp-card:active .emp-avatar {
    transform: scale(0.88) rotate(0deg) !important;
    transition-duration: 0.1s;
  }
  .emp-info { flex: 1; min-width: 0; }
  .emp-name { font-size: 15px; font-weight: 700; color: var(--text-primary); margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: -0.2px; }
  .emp-meta { font-size: 12px; color: var(--text-secondary); display: flex; gap: 6px; align-items: center; }
  .emp-dot { width: 4px; height: 4px; border-radius: 50%; flex-shrink: 0; opacity: 0.5; }
  .status-badge {
    flex-shrink: 0; padding: 4px 11px; border-radius: 22px;
    font-size: 10px; font-weight: 800; letter-spacing: 0.5px; text-transform: uppercase;
    transition: all 0.2s;
  }
  .status-active {
    background: rgba(16,185,129,0.15); color: #6EE7B7;
    border: 1px solid rgba(16,185,129,0.3);
    box-shadow: 0 0 10px rgba(16,185,129,0.1);
  }
  .status-inactive {
    background: rgba(239,68,68,0.13); color: #FCA5A5;
    border: 1px solid rgba(239,68,68,0.25);
  }
  .status-probation {
    background: rgba(245,158,11,0.15); color: #FCD34D;
    border: 1px solid rgba(245,158,11,0.3);
    box-shadow: 0 0 10px rgba(245,158,11,0.1);
  }

  /* Stats row */
  #stats-row {
    display: flex; gap: 8px; padding: 12px 16px 0; flex-shrink: 0;
    animation: fadeInUp 0.5s cubic-bezier(0.34,1.56,0.64,1) 0.15s both;
  }
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .stat-chip {
    flex: 1; padding: 13px 10px 11px; border-radius: 16px; text-align: center;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    transition: all 0.35s cubic-bezier(0.34,1.56,0.64,1);
    cursor: default; position: relative; overflow: hidden;
    animation: statSlideIn 0.55s cubic-bezier(0.34,1.56,0.64,1) both;
  }
  .stat-chip:nth-child(1) { animation-delay: 0.05s; }
  .stat-chip:nth-child(2) { animation-delay: 0.12s; }
  .stat-chip:nth-child(3) { animation-delay: 0.19s; }
  .stat-chip:nth-child(4) { animation-delay: 0.26s; }
  @keyframes statSlideIn {
    from { opacity: 0; transform: translateY(14px) scale(0.92); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  /* glowing bottom bar */
  .stat-chip::before {
    content: ''; position: absolute; bottom: 0; left: 0; right: 0;
    height: 2.5px; border-radius: 0 0 16px 16px;
    transition: height 0.3s ease, opacity 0.3s;
  }
  .stat-chip:first-child::before  { background: linear-gradient(90deg,#3B82F6,#8B5CF6); box-shadow: 0 0 10px rgba(59,130,246,0.7); }
  .stat-chip:nth-child(2)::before { background: linear-gradient(90deg,#10B981,#06B6D4); box-shadow: 0 0 10px rgba(16,185,129,0.7); }
  .stat-chip:nth-child(3)::before { background: linear-gradient(90deg,#EF4444,#F59E0B); box-shadow: 0 0 10px rgba(239,68,68,0.7); }
  .stat-chip:nth-child(4)::before { background: linear-gradient(90deg,#F59E0B,#EF4444); box-shadow: 0 0 10px rgba(245,158,11,0.7); }
  /* ambient glow on hover */
  .stat-chip::after {
    content: ''; position: absolute; inset: 0;
    background: radial-gradient(ellipse at 50% 120%, rgba(255,255,255,0.06) 0%, transparent 70%);
    opacity: 0; transition: opacity 0.3s;
  }
  .stat-chip:hover::after { opacity: 1; }
  .stat-chip:hover { background: rgba(255,255,255,0.08); transform: translateY(-3px) scale(1.02);
    box-shadow: 0 8px 24px rgba(0,0,0,0.25); }
  .stat-chip:hover::before { height: 3.5px; }
  .stat-num {
    font-size: 24px; font-weight: 800; line-height: 1;
    font-variant-numeric: tabular-nums;
    transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
    letter-spacing: -0.5px;
    text-shadow: 0 0 20px currentColor;
  }
  .stat-num.bump { animation: numBump 0.5s cubic-bezier(0.34,1.56,0.64,1); }
  .stat-num.counting { animation: numPulse 0.08s ease-in-out infinite alternate; }
  @keyframes numBump {
    0%   { transform: scale(1); }
    40%  { transform: scale(1.35); }
    70%  { transform: scale(0.95); }
    100% { transform: scale(1); }
  }
  @keyframes numPulse {
    from { opacity: 0.75; }
    to   { opacity: 1; }
  }
  .stat-lbl {
    font-size: 9px; color: var(--text-tertiary); margin-top: 4px;
    font-weight: 700; text-transform: uppercase; letter-spacing: 1.2px;
  }

  /* Floating bottom nav */
  #bottom-nav {
    position: fixed; bottom: var(--nav-bottom-gap); left: 50%; transform: translateX(-50%);
    z-index: 200; display: flex; align-items: center; gap: 2px;
    max-width: calc(100vw - var(--safe-left) - var(--safe-right) - 24px);
    padding: 6px 10px;
    background: rgba(12,12,26,0.85);
    backdrop-filter: blur(48px) saturate(2);
    -webkit-backdrop-filter: blur(48px) saturate(2);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 26px;
    box-shadow:
      0 8px 40px rgba(0,0,0,0.5),
      0 0 0 1px rgba(255,255,255,0.05) inset,
      0 1px 0 rgba(255,255,255,0.1) inset;
    animation: navSlideUp 0.6s cubic-bezier(0.34,1.56,0.64,1) 0.3s both;
  }
  @keyframes navSlideUp {
    from { transform: translateX(-50%) translateY(100px); opacity: 0; }
    to { transform: translateX(-50%) translateY(0); opacity: 1; }
  }
  .nav-btn {
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    padding: 8px 16px 7px; border-radius: 20px; cursor: pointer;
    transition: color 0.3s ease, background 0.3s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.3s ease;
    color: var(--text-tertiary); -webkit-tap-highlight-color: transparent;
    font-size: 9px; font-weight: 700; letter-spacing: 0.3px; text-transform: uppercase;
    position: relative; overflow: hidden; user-select: none;
  }

  /* Active indicator dot above icon */
  .nav-btn::before {
    content: '';
    position: absolute;
    top: 5px; left: 50%; transform: translateX(-50%) scaleX(0);
    width: 18px; height: 3px; border-radius: 3px;
    background: var(--accent-bright);
    box-shadow: 0 0 8px rgba(59,130,246,0.8);
    transition: transform 0.35s cubic-bezier(0.34,1.56,0.64,1), opacity 0.3s ease;
    opacity: 0;
    transform-origin: center;
  }
  .nav-btn.active::before {
    transform: translateX(-50%) scaleX(1);
    opacity: 1;
  }

  /* Ripple element */
  .nav-btn .nav-ripple {
    position: absolute; border-radius: 50%;
    background: rgba(59,130,246,0.25);
    transform: scale(0); opacity: 1;
    pointer-events: none;
    animation: navRippleAnim 0.5s cubic-bezier(0,0,0.2,1) forwards;
  }
  @keyframes navRippleAnim {
    to { transform: scale(2.8); opacity: 0; }
  }

  /* Particle canvas overlay */
  .nav-btn canvas.nav-particles {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
  }

  .nav-btn.active {
    background: rgba(59,130,246,0.16);
    color: var(--accent-bright);
    box-shadow: 0 0 24px rgba(59,130,246,0.18), inset 0 1px 0 rgba(255,255,255,0.1);
  }
  .nav-btn:not(.active):hover { color: var(--text-secondary); background: rgba(255,255,255,0.06); }

  /* Icon wrapper */
  .nav-btn .nav-icon-wrap {
    position: relative;
    width: 24px; height: 24px;
    display: flex; align-items: center; justify-content: center;
  }
  .nav-btn svg {
    width: 22px; height: 22px;
    transition: transform 0.35s cubic-bezier(0.34,1.56,0.64,1), filter 0.3s ease;
    position: relative; z-index: 1;
  }
  .nav-btn.active svg {
    filter: drop-shadow(0 0 5px rgba(59,130,246,0.7)) drop-shadow(0 0 12px rgba(59,130,246,0.35));
    animation: navIconBounce 0.5s cubic-bezier(0.34,1.56,0.64,1);
  }
  @keyframes navIconBounce {
    0%   { transform: scale(1) translateY(0); }
    30%  { transform: scale(1.28) translateY(-3px); }
    55%  { transform: scale(0.92) translateY(1px); }
    75%  { transform: scale(1.1) translateY(-1px); }
    100% { transform: scale(1) translateY(0); }
  }

  /* Orbiting glow ring on active */
  .nav-btn .nav-icon-ring {
    position: absolute; inset: -5px;
    border-radius: 50%;
    border: 1.5px solid transparent;
    border-top-color: rgba(59,130,246,0.7);
    border-right-color: rgba(139,92,246,0.4);
    opacity: 0;
    transition: opacity 0.3s ease;
    pointer-events: none;
  }
  .nav-btn.active .nav-icon-ring {
    opacity: 1;
    animation: navRingOrbit 1.8s linear infinite;
  }
  @keyframes navRingOrbit {
    to { transform: rotate(360deg); }
  }

  /* Label slide-up on activate */
  .nav-btn span.nav-label {
    transition: color 0.3s ease, transform 0.35s cubic-bezier(0.34,1.56,0.64,1), opacity 0.3s ease;
    display: block;
  }
  .nav-btn.active span.nav-label {
    animation: navLabelPop 0.4s cubic-bezier(0.34,1.56,0.64,1);
  }
  @keyframes navLabelPop {
    0%   { transform: translateY(3px); opacity: 0.4; }
    60%  { transform: translateY(-1px); opacity: 1; }
    100% { transform: translateY(0); opacity: 1; }
  }

  /* Tap press */
  .nav-btn.nav-pressing svg {
    transform: scale(0.8) translateY(2px);
    filter: brightness(1.4);
  }

  /* Modal overlay */
  #modal-overlay {
    position: fixed; inset: 0; z-index: 500;
    background: rgba(0,0,0,0);
    backdrop-filter: blur(0px); -webkit-backdrop-filter: blur(0px);
    display: none; align-items: flex-end; justify-content: center;
    padding: var(--safe-top) var(--safe-right) var(--safe-bottom) var(--safe-left);
    transition: background 0.32s ease, backdrop-filter 0.32s ease;
    will-change: background, backdrop-filter;
  }
  #modal-overlay.show { display: flex; }
  #modal-overlay.visible {
    background: rgba(0,0,0,0.72);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  }
  #modal-sheet {
    width: 100%; max-width: 540px; max-height: 92vh;
    border-radius: 28px 28px 0 0;
    background: linear-gradient(180deg, rgba(18,18,32,0.98) 0%, rgba(12,12,22,0.99) 100%);
    backdrop-filter: blur(40px) saturate(1.8); -webkit-backdrop-filter: blur(40px) saturate(1.8);
    border-top: 1px solid rgba(255,255,255,0.18);
    border-left: 1px solid rgba(255,255,255,0.08);
    border-right: 1px solid rgba(255,255,255,0.08);
    box-shadow:
      0 -24px 80px rgba(0,0,0,0.7),
      0 -1px 0 rgba(99,102,241,0.25),
      inset 0 1px 0 rgba(255,255,255,0.08);
    display: flex; flex-direction: column; overflow: hidden;
    transform: translateY(110%) scale(0.97);
    transition: transform 0.42s cubic-bezier(0.22,1.05,0.36,1);
    will-change: transform;
  }
  #modal-overlay.visible #modal-sheet {
    transform: translateY(0) scale(1);
  }
  .modal-handle {
    width: 40px; height: 4px; border-radius: 3px;
    background: rgba(255,255,255,0.18); margin: 12px auto 0;
    flex-shrink: 0; transition: background 0.2s;
  }
  .modal-handle:hover { background: rgba(255,255,255,0.3); }
  .modal-header {
    padding: 18px 22px 14px; display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid rgba(255,255,255,0.07); flex-shrink: 0;
  }
  .modal-title { font-size: 18px; font-weight: 700; letter-spacing: -0.3px; }
  .modal-close {
    width: 32px; height: 32px; border-radius: 50%; cursor: pointer;
    background: rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: center;
    transition: all 0.2s; border: none; color: var(--text-secondary);
    -webkit-tap-highlight-color: transparent;
  }
  .modal-close:hover { background: rgba(255,255,255,0.14); color: var(--text-primary); transform: scale(1.05); }
  .modal-close:active { transform: scale(0.92); background: rgba(255,255,255,0.2); }
  .modal-body {
    flex: 1; overflow-y: auto; padding: 16px 16px 8px;
    -webkit-overflow-scrolling: touch;
  }
  .modal-body::-webkit-scrollbar { width: 3px; }
  .modal-body::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }
  .modal-footer {
    padding: 14px calc(16px + var(--safe-right)) calc(14px + var(--safe-bottom)) calc(16px + var(--safe-left));
    border-top: 1px solid rgba(255,255,255,0.07);
    display: flex; gap: 10px; flex-shrink: 0;
    background: linear-gradient(0deg, rgba(0,0,0,0.2), transparent);
  }
  /* Modal handle animation */
  .modal-handle {
    width: 36px; height: 4px; border-radius: 3px;
    background: rgba(255,255,255,0.15); margin: 12px auto 0;
    flex-shrink: 0; transition: all 0.3s ease;
    animation: handlePulse 3s ease-in-out 0.5s infinite;
  }
  @keyframes handlePulse {
    0%,100%  { background: rgba(255,255,255,0.15); width: 36px; }
    50%      { background: rgba(255,255,255,0.28); width: 42px; }
  }
  /* Modal title animated underline */
  .modal-title {
    font-size: 18px; font-weight: 800; letter-spacing: -0.4px;
    background: linear-gradient(135deg, #e2e8f0 30%, rgba(255,255,255,0.65));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  /* Form elements */
  .form-section { margin-bottom: 22px; }
  .form-section-title {
    font-size: 10px; font-weight: 800; color: var(--text-tertiary);
    text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 12px;
    display: flex; align-items: center; gap: 8px;
  }
  .form-section-title::after {
    content: ''; flex: 1; height: 1px; background: rgba(255,255,255,0.06);
  }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .form-grid.full { grid-template-columns: 1fr; }
  .form-field { display: flex; flex-direction: column; gap: 6px; }
  .form-label { font-size: 11px; font-weight: 700; color: var(--text-secondary); letter-spacing: 0.3px; }
  .form-label .req { color: var(--danger-bright); }
  .form-input, .form-select {
    width: 100%; padding: 12px 14px; border-radius: 12px;
    background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.10);

    transition: all 0.2s cubic-bezier(0.4,0,0.2,1); -webkit-appearance: none; appearance: none;
  }

  .form-select-wrap::after {

  /* Buttons */
  .btn {
    display: flex; align-items: center; justify-content: center; gap: 7px;
    padding: 13px 22px; border-radius: 14px; cursor: pointer; border: none;
    font-size: 14px; font-weight: 700; font-family: inherit;

  .btn-primary {

  .btn-success {

  .btn-ghost {

  .btn-ghost:hover { background: rgba(255,255,255,0.12); color: var(--text-primary); }
  .btn-sm { padding: 8px 16px; font-size: 13px; border-radius: 10px; }
  .btn-full { width: 100%; }

  /* Detail view */
  .detail-row {
    display: flex; justify-content: space-between; align-items: flex-start;
    padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.07);
  }
  .detail-row:last-child { border-bottom: none; }
  .detail-label { font-size: 13px; color: var(--text-secondary); flex-shrink: 0; margin-right: 12px; }
  .detail-value { font-size: 14px; font-weight: 500; text-align: right; color: var(--text-primary); word-break: break-word; }

  /* Toast */
  #toast-container { position: fixed; top: calc(70px + var(--safe-top)); right: calc(16px + var(--safe-right)); z-index: 9999; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
  .toast {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 16px; border-radius: 14px; min-width: 220px; max-width: 320px;
    background: rgba(20,20,30,0.9);
    backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
    border: 1px solid rgba(255,255,255,0.15);
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    animation: toastIn 0.35s cubic-bezier(0.34,1.56,0.64,1);
    pointer-events: auto;
  }

  .toast-text { font-size: 14px; font-weight: 600; flex: 1; }

  .toast-info .toast-icon { background: rgba(59,130,246,0.2); color: #93C5FD; }

  /* Login screen */
  #login-screen {
    position: fixed; inset: 0; z-index: 1000;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: calc(24px + var(--safe-top)) calc(24px + var(--safe-right)) calc(24px + var(--safe-bottom)) calc(24px + var(--safe-left));
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  }
  #login-card {
    width: 100%; max-width: 380px;

  @keyframes logoPulse {

    50% { box-shadow: 0 16px 40px rgba(139,92,246,0.55), 0 4px 12px rgba(0,0,0,0.3), 0 0 0 6px rgba(139,92,246,0.1); }

  .login-input-wrap {
    position: relative; margin-bottom: 10px;
  }
  .login-input-wrap input {

  .login-input-wrap .input-icon { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--text-tertiary); width: 18px; height: 18px; z-index: 2; }
  .login-input-wrap .pw-toggle { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); cursor: pointer; color: var(--text-tertiary); background: none; border: none; padding: 4px; z-index: 2; transition: color 0.2s; }

  .input-error { border-color: rgba(239,68,68,0.5) !important; box-shadow: 0 0 0 3px rgba(239,68,68,0.1) !important; }
  .error-msg { font-size: 13px; color: #FCA5A5; text-align: center; margin-bottom: 8px; min-height: 18px; font-weight: 500; }

  /* Skeleton */
  .skeleton {
    background: linear-gradient(90deg, rgba(255,255,255,0.04) 25%, rgba(255,255,255,0.09) 50%, rgba(255,255,255,0.04) 75%);
    background-size: 200% 100%; animation: shimmer 1.8s ease infinite; border-radius: 8px;
  }
  @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

  /* Animations */
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes slideUp { from { transform: translateY(60%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  @keyframes scaleIn { from { opacity: 0; transform: scale(0.88); } to { opacity: 1; transform: scale(1); } }
  @keyframes toastIn { from { opacity: 0; transform: translateX(30px) scale(0.88); } to { opacity: 1; transform: translateX(0) scale(1); } }
  @keyframes toastOut { from { opacity: 1; transform: translateX(0) scale(1); } to { opacity: 0; transform: translateX(30px) scale(0.88); } }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Divider */

  /* Connection dot */
  .conn-dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }

  @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(0.8); } }

  /* Confirm dialog */
  #confirm-overlay {
    position: fixed; inset: 0; z-index: 600;
    background: rgba(0,0,0,0.75);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    display: none; align-items: center; justify-content: center; padding: calc(24px + var(--safe-top)) calc(24px + var(--safe-right)) calc(24px + var(--safe-bottom)) calc(24px + var(--safe-left));
  }
  #confirm-overlay.show { display: flex; animation: fadeIn 0.2s ease; }
  #confirm-box {
    width: 100%; max-width: 320px;
    background: rgba(10,10,24,0.98);
    backdrop-filter: blur(48px); -webkit-backdrop-filter: blur(48px);
    border: 1px solid rgba(255,255,255,0.14); border-radius: 24px; padding: 28px 24px;
    box-shadow: 0 24px 80px rgba(0,0,0,0.7), inset 0 1px 0 rgba(255,255,255,0.1);
    animation: scaleIn 0.3s cubic-bezier(0.34,1.56,0.64,1);

  /* Empty state */
  .empty-state { padding: 70px 24px; text-align: center; }
  .empty-icon { font-size: 52px; margin-bottom: 18px; opacity: 0.4; }

  /* Offline banner */
  #offline-banner {

  /* Scrollbar */

  .modal-body::-webkit-scrollbar-track { background: transparent; }

  /* Avatar colors — more vibrant */

    color: #dbeafe;
    box-shadow: 0 4px 18px rgba(37,99,235,0.5), inset 0 1px 0 rgba(255,255,255,0.2);
    --av-conic: conic-gradient(from 0deg, #1d4ed8, #60a5fa, #7c3aed, #1d4ed8);

  .av-purple {
    background: linear-gradient(145deg, #4c1d95 0%, #7c3aed 50%, #c4b5fd 100%);

    box-shadow: 0 4px 18px rgba(124,58,237,0.5), inset 0 1px 0 rgba(255,255,255,0.2);
    --av-conic: conic-gradient(from 0deg, #6d28d9, #c4b5fd, #ec4899, #6d28d9);
  }
  .av-green {
    background: linear-gradient(145deg, #064e3b 0%, #059669 50%, #34d399 100%);
    color: #d1fae5;
    box-shadow: 0 4px 18px rgba(5,150,105,0.5), inset 0 1px 0 rgba(255,255,255,0.2);
    --av-conic: conic-gradient(from 0deg, #047857, #6ee7b7, #0891b2, #047857);
  }
  .av-orange {
    background: linear-gradient(145deg, #78350f 0%, #d97706 50%, #fbbf24 100%);
    color: #fef3c7;
    box-shadow: 0 4px 18px rgba(217,119,6,0.5), inset 0 1px 0 rgba(255,255,255,0.2);
    --av-conic: conic-gradient(from 0deg, #b45309, #fcd34d, #ef4444, #b45309);
  }
  .av-pink {
    background: linear-gradient(145deg, #831843 0%, #db2777 50%, #f9a8d4 100%);
    color: #fce7f3;
    box-shadow: 0 4px 18px rgba(219,39,119,0.5), inset 0 1px 0 rgba(255,255,255,0.2);
    --av-conic: conic-gradient(from 0deg, #be185d, #f9a8d4, #8b5cf6, #be185d);
  }
  .av-teal {
    background: linear-gradient(145deg, #134e4a 0%, #0d9488 50%, #5eead4 100%);
    color: #ccfbf1;
    box-shadow: 0 4px 18px rgba(13,148,136,0.5), inset 0 1px 0 rgba(255,255,255,0.2);
    --av-conic: conic-gradient(from 0deg, #0f766e, #5eead4, #3b82f6, #0f766e);
  }

  /* per-color hover glow */
  .emp-card:hover .av-blue   { box-shadow: 0 10px 32px rgba(37,99,235,0.65),  0 0 0 3px rgba(96,165,250,0.3); }
  .emp-card:hover .av-purple { box-shadow: 0 10px 32px rgba(124,58,237,0.65), 0 0 0 3px rgba(196,181,253,0.3); }
  .emp-card:hover .av-green  { box-shadow: 0 10px 32px rgba(5,150,105,0.65),  0 0 0 3px rgba(52,211,153,0.3); }
  .emp-card:hover .av-orange { box-shadow: 0 10px 32px rgba(217,119,6,0.65),  0 0 0 3px rgba(251,191,36,0.3); }
  .emp-card:hover .av-pink   { box-shadow: 0 10px 32px rgba(219,39,119,0.65), 0 0 0 3px rgba(249,168,212,0.3); }
  .emp-card:hover .av-teal   { box-shadow: 0 10px 32px rgba(13,148,136,0.65), 0 0 0 3px rgba(94,234,212,0.3); }

  /* stagger entrance per card position */
  .emp-card:nth-child(1)  .emp-avatar { animation-delay: 0.03s; }
  .emp-card:nth-child(2)  .emp-avatar { animation-delay: 0.08s; }
  .emp-card:nth-child(3)  .emp-avatar { animation-delay: 0.13s; }
  .emp-card:nth-child(4)  .emp-avatar { animation-delay: 0.18s; }
  .emp-card:nth-child(5)  .emp-avatar { animation-delay: 0.23s; }
  .emp-card:nth-child(6)  .emp-avatar { animation-delay: 0.28s; }
  .emp-card:nth-child(7)  .emp-avatar { animation-delay: 0.33s; }
  .emp-card:nth-child(8)  .emp-avatar { animation-delay: 0.38s; }
  .emp-card:nth-child(n+9) .emp-avatar { animation-delay: 0.42s; }

  /* Detail view */
  .detail-row {
    display: flex; justify-content: space-between; align-items: flex-start;
    padding: 13px 14px; margin-bottom: 6px;
    border-radius: 12px;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.055);
    transition: background 0.2s, transform 0.2s;
    animation: rowFadeIn 0.38s cubic-bezier(0.22,1,0.36,1) both;
  }
  .detail-row:hover { background: rgba(255,255,255,0.06); transform: translateX(2px); }
  @keyframes rowFadeIn {
    from { opacity: 0; transform: translateX(-10px); }
    to   { opacity: 1; transform: translateX(0); }
  }
  .detail-row:nth-child(1)  { animation-delay: 0.04s; }
  .detail-row:nth-child(2)  { animation-delay: 0.08s; }
  .detail-row:nth-child(3)  { animation-delay: 0.12s; }
  .detail-row:nth-child(4)  { animation-delay: 0.16s; }
  .detail-row:nth-child(5)  { animation-delay: 0.20s; }
  .detail-row:nth-child(6)  { animation-delay: 0.24s; }
  .detail-row:nth-child(7)  { animation-delay: 0.28s; }
  .detail-row:nth-child(8)  { animation-delay: 0.32s; }
  .detail-row:nth-child(n+9){ animation-delay: 0.36s; }
  .detail-label {
    display: flex; align-items: center; gap: 7px;
    font-size: 11px; color: var(--text-tertiary); flex-shrink: 0;
    font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px;
    min-width: 90px;
  }
  .detail-label .dl-icon {
    width: 22px; height: 22px; border-radius: 7px;
    background: rgba(255,255,255,0.07);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; font-size: 11px;
  }
  .detail-value {
    font-size: 14px; font-weight: 600; text-align: right;
    color: var(--text-primary); word-break: break-word;
    max-width: 65%;
  }
  .detail-value.monospace { font-family: ui-monospace,monospace; font-size: 12.5px; letter-spacing: 0.3px; }
  .detail-value.highlight {
    color: #93c5fd;
    background: rgba(99,102,241,0.1);
    padding: 3px 8px; border-radius: 6px;
    font-size: 12.5px;
  }

  /* Toast */
  #toast-container { position: fixed; top: calc(72px + var(--safe-top)); right: calc(16px + var(--safe-right)); z-index: 9999; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
  .toast {
    display: flex; align-items: center; gap: 11px;
    padding: 13px 17px; border-radius: 16px; min-width: 230px; max-width: 320px;
    background: rgba(12,12,26,0.95);
    backdrop-filter: blur(28px); -webkit-backdrop-filter: blur(28px);
    border: 1px solid rgba(255,255,255,0.12);
    box-shadow: 0 12px 32px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.08);
    animation: toastIn 0.4s cubic-bezier(0.34,1.56,0.64,1);
    pointer-events: auto;
  }
  .toast.removing { animation: toastOut 0.25s ease forwards; }
  .toast-icon { width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }

  /* Inset top spacing for status bar */
  @supports (padding-top: env(safe-area-inset-top)) {
    /* Padding now handled directly via #login-screen safe-area vars */
  }

  /* Role badge upgrade */
  #role-badge {
    padding: 4px 12px; border-radius: 12px;
    font-size: 11px; font-weight: 700; letter-spacing: 0.5px;
    text-transform: uppercase;
  }

  /* === Multi-view tabs === */
  .view { display: none; }
  .view.active { display: flex; flex-direction: column; flex: 1; min-height: 0; overflow: hidden; }
  .device-card {
    display: flex; align-items: flex-start; gap: 14px;
    padding: 14px 16px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 18px;
    margin-bottom: 8px;
    transition: background 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    position: relative; overflow: hidden;
    animation: cardIn 0.3s ease both;
    will-change: transform;
  }
  .device-card::before {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(135deg, rgba(255,255,255,0.055) 0%, transparent 50%);
    pointer-events: none;
  }
  .device-card::after {
    content: ''; position: absolute; top: 0; left: -100%; width: 60%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.06), transparent);
    transition: left 0.5s ease;
    pointer-events: none;
  }
  .device-card:hover::after { left: 150%; }
  .device-card:hover {
    background: rgba(255,255,255,0.075);
    border-color: rgba(59,130,246,0.22);
    transform: translateY(-2px) scale(1.005);
    box-shadow: 0 12px 40px rgba(0,0,0,0.35), 0 0 0 1px rgba(59,130,246,0.12);
  }
  .device-card:active { transform: scale(0.98); background: rgba(255,255,255,0.09); }
  /* ══════════════════════════════
     DEV-ICON  — rich 3D animated
     ══════════════════════════════ */
  .device-card .dev-icon {
    width: 46px; height: 46px; border-radius: 16px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; position: relative;
    /* entrance pop */
    animation: devIconPop 0.55s cubic-bezier(0.34,1.56,0.64,1) both;
    transition: transform 0.4s cubic-bezier(0.34,1.56,0.64,1),
                box-shadow 0.35s ease;
    transform-style: preserve-3d;
    /* default laptop colours — overridden per variant */
    background: linear-gradient(145deg, #1e3a8a 0%, #1d4ed8 55%, #3b82f6 100%);
    color: #bfdbfe;
    box-shadow: 0 4px 16px rgba(29,78,216,0.45),
                inset 0 1px 0 rgba(255,255,255,0.18);
  }

  /* entrance keyframe */
  @keyframes devIconPop {
    0%   { opacity:0; transform:scale(0.4) rotate(-20deg); }
    55%  { opacity:1; transform:scale(1.16) rotate(6deg); }
    78%  { transform:scale(0.93) rotate(-2deg); }
    100% { opacity:1; transform:scale(1) rotate(0deg); }
  }

  /* glass sheen top-left */
  .device-card .dev-icon::before {
    content:''; position:absolute; inset:0; border-radius:16px;
    background: linear-gradient(135deg,
      rgba(255,255,255,0.26) 0%,
      rgba(255,255,255,0.06) 38%,
      transparent 62%);
    pointer-events:none; z-index:2;
  }

  /* spinning conic border — appears on hover */
  .device-card .dev-icon::after {
    content:''; position:absolute; inset:-2.5px; border-radius:19px;
    background: var(--di-conic, conic-gradient(from 0deg,#1d4ed8,#60a5fa,#7c3aed,#1d4ed8));
    z-index:-1; opacity:0;
    transition:opacity 0.3s ease;
    animation: devBorderSpin 2.2s linear infinite paused;
  }
  @keyframes devBorderSpin { to { transform:rotate(360deg); } }

  /* SVG sits above sheen */
  .device-card .dev-icon svg {
    width: 22px; height: 22px;
    position:relative; z-index:3;
    transition: transform 0.4s cubic-bezier(0.34,1.56,0.64,1),
                filter 0.3s ease, drop-shadow 0.3s;
    filter: drop-shadow(0 1px 3px rgba(0,0,0,0.4));
  }

  /* ── HOVER: tilt-lift + spin border + glow ── */
  .device-card:hover .dev-icon {
    transform: scale(1.18) rotate(-10deg) translateY(-4px);
  }
  .device-card:hover .dev-icon::after {
    opacity:1;
    animation-play-state:running;
  }
  .device-card:hover .dev-icon svg {
    transform: rotate(8deg) scale(1.1);
    filter: drop-shadow(0 0 8px currentColor);
  }

  /* ── PRESS ── */
  .device-card:active .dev-icon {
    transform: scale(0.86) rotate(0deg) !important;
    transition-duration: 0.08s;
  }

  /* ── staggered entrance ── */
  .device-card:nth-child(1)  .dev-icon { animation-delay:0.03s; }
  .device-card:nth-child(2)  .dev-icon { animation-delay:0.08s; }
  .device-card:nth-child(3)  .dev-icon { animation-delay:0.13s; }
  .device-card:nth-child(4)  .dev-icon { animation-delay:0.18s; }
  .device-card:nth-child(5)  .dev-icon { animation-delay:0.23s; }
  .device-card:nth-child(6)  .dev-icon { animation-delay:0.28s; }
  .device-card:nth-child(7)  .dev-icon { animation-delay:0.33s; }
  .device-card:nth-child(8)  .dev-icon { animation-delay:0.38s; }
  .device-card:nth-child(n+9) .dev-icon{ animation-delay:0.42s; }

  /* ── STATUS colour variants ── */
  /* laptop In Used — blue */
  .dev-icon.di-inused {
    background: linear-gradient(145deg,#1e3a8a,#1d4ed8,#3b82f6);
    color:#bfdbfe;
    box-shadow:0 4px 16px rgba(29,78,216,0.5), inset 0 1px 0 rgba(255,255,255,0.18);
    --di-conic: conic-gradient(from 0deg,#1d4ed8,#60a5fa,#7c3aed,#1d4ed8);
  }
  .device-card:hover .di-inused {
    box-shadow:0 10px 30px rgba(29,78,216,0.7), 0 0 0 3px rgba(96,165,250,0.35);
  }
  /* laptop Backup — amber */
  .dev-icon.di-backup {
    background: linear-gradient(145deg,#78350f,#d97706,#fbbf24);
    color:#fef3c7;
    box-shadow:0 4px 16px rgba(217,119,6,0.5), inset 0 1px 0 rgba(255,255,255,0.18);
    --di-conic: conic-gradient(from 0deg,#b45309,#fcd34d,#f97316,#b45309);
  }
  .device-card:hover .di-backup {
    box-shadow:0 10px 30px rgba(217,119,6,0.7), 0 0 0 3px rgba(251,191,36,0.35);
  }
  /* laptop Returned / Broken / other — slate */
  .dev-icon.di-other {
    background: linear-gradient(145deg,#1e293b,#334155,#64748b);
    color:#cbd5e1;
    box-shadow:0 4px 16px rgba(51,65,85,0.5), inset 0 1px 0 rgba(255,255,255,0.12);
    --di-conic: conic-gradient(from 0deg,#475569,#94a3b8,#334155,#475569);
  }
  .device-card:hover .di-other {
    box-shadow:0 10px 30px rgba(51,65,85,0.65), 0 0 0 3px rgba(148,163,184,0.3);
  }
  /* account icon — emerald-teal */
  .dev-icon.di-account {
    background: linear-gradient(145deg,#064e3b,#059669,#2dd4bf);
    color:#d1fae5;
    box-shadow:0 4px 16px rgba(5,150,105,0.5), inset 0 1px 0 rgba(255,255,255,0.18);
    --di-conic: conic-gradient(from 0deg,#047857,#34d399,#0ea5e9,#047857);
  }
  .device-card:hover .di-account {
    box-shadow:0 10px 30px rgba(5,150,105,0.7), 0 0 0 3px rgba(52,211,153,0.35);
  }

  /* ── idle pulse glow on di-inused ── */
  @keyframes devGlowPulse {
    0%,100% { box-shadow:0 4px 16px rgba(29,78,216,0.5), inset 0 1px 0 rgba(255,255,255,0.18); }
    50%     { box-shadow:0 6px 24px rgba(29,78,216,0.75), 0 0 0 4px rgba(96,165,250,0.12), inset 0 1px 0 rgba(255,255,255,0.18); }
  }
  .di-inused { animation: devIconPop 0.55s cubic-bezier(0.34,1.56,0.64,1) both,
                           devGlowPulse 2.8s ease-in-out 0.7s infinite; }
  .device-card .dev-info { flex: 1; min-width: 0; }
  .device-card .dev-title {
    font-size: 14px; font-weight: 600; color: var(--text-primary);
    margin-bottom: 3px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .device-card .dev-meta {
    font-size: 11.5px; color: var(--text-secondary);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
  }
  .device-card .dev-meta code {
    font-family: ui-monospace, SFMono-Regular, monospace;
    font-size: 10.5px; padding: 1px 6px;
    background: rgba(255,255,255,0.06);
    border-radius: 5px;
  }

</style>
</head>

function _mapTrangThaiToActive(trang_thai) {
  if (trang_thai === 'Inactive') return false;
  return true; // Active hoặc Probation
}

async function syncStatusToAttendance(ho_ten, trang_thai) {
  try {
    if (!ho_ten || !trang_thai) return { skipped: true };
    const name = String(ho_ten).trim();
    if (!name) return { skipped: true };
    const is_active = _mapTrangThaiToActive(trang_thai);
    const url = `${WA_SUPABASE_URL}/rest/v1/hr_employees?name=eq.${encodeURIComponent(name)}`;
    const r = await fetch(url, {
      method: 'PATCH',
      headers: {
        'apikey': WA_SUPABASE_KEY,
        'Authorization': `Bearer ${WA_SUPABASE_KEY}`,
        'Content-Type': 'application/json',
        'Prefer': 'return=representation',
      },
      body: JSON.stringify({ is_active }),
    });
    if (!r.ok) {
      const t = await r.text().catch(()=> '');
      console.warn('[sync] Lỗi sync sang Work_Attendance:', r.status, t);
      return { ok: false, status: r.status, error: t };
    }
    const rows = await r.json().catch(()=>[]);
    console.log(`[sync] ${name} -> is_active=${is_active} (cập nhật ${rows.length} dòng)`);
    return { ok: true, updated: rows.length, is_active };
  } catch (e) {
    console.warn('[sync] Exception:', e);
    return { ok: false, error: String(e?.message || e) };
  }
}

async function supaSignIn(email, password){
  const r = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
    method: "POST",
    headers: { "apikey": SUPABASE_KEY, "Content-Type": "application/json" },
    body: JSON.stringify({ email, password })
  });
  const j = await r.json().catch(()=>({}));
  if (!r.ok) throw new Error(j.error_description || j.msg || "Sai email hoặc mật khẩu");
  return j; // { access_token, refresh_token, user, ... }
}
async function supaSignOut(){
  if (!_session?.access_token) { _saveSession(null); return; }
  try {
    await fetch(`${SUPABASE_URL}/auth/v1/logout`, {
      method: "POST",
      headers: { "apikey": SUPABASE_KEY, "Authorization": `Bearer ${_session.access_token}` }
    });
  } catch(_){}
  _saveSession(null);
}

const TRANG_THAI_OPTIONS = ["Active","Inactive","Probation"];

  "apikey": SUPABASE_KEY,
  "Authorization": `Bearer ${_bearer()}`,
  "Content-Type": "application/json",
  "Prefer": "return=representation",
});
const _url = (p="") => `${SUPABASE_URL}/rest/v1/nhan_su${p}`;

async function dbSearch(kw="", filter="All") {
  const parts = [];
  const k = kw.trim();
  if (k) {
    const conds = ALL_SEARCH_FIELDS.map(f=>`${f}.ilike.*${k}*`).join(",");
    parts.push(`or=(${conds})`);
  }
  if (filter && filter!=="All") parts.push(`trang_thai=eq.${filter}`);
  parts.push("order=no.asc");
  const q = "?" + parts.join("&");
  const r = await fetch(_url(q), {headers:_h()});
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  return r.json();
}

async function dbInsert(data) {
  const r = await fetch(_url(), {method:"POST", headers:_h(), body:JSON.stringify(data)});
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}

async function dbUpdate(id, data) {
  const r = await fetch(_url(`?id=eq.${id}`), {method:"PATCH", headers:_h(), body:JSON.stringify(data)});

  return r.json();
}

async function dbDelete(id) {
  const r = await fetch(_url(`?id=eq.${id}`), {method:"DELETE", headers:_h()});
  if (!r.ok) throw new Error(await r.text());
}

async function doLogin() {
  const u = document.getElementById("login-user").value.trim();
  const p = document.getElementById("login-pass").value;
  const err = document.getElementById("login-error");
  err.textContent = "";
  if (!u || !p) { err.textContent = "Vui lòng nhập đầy đủ thông tin"; return; }
  try {
    const sess = await supaSignIn(u, p);
    _saveSession(sess); localStorage.removeItem("guest_mode");
    if (_isAdminEmail(sess.user?.email)) {
      startApp("admin");
    } else {
      // Đăng nhập hợp lệ nhưng không phải admin → vào chế độ user (chỉ đọc)
      startApp("user");
    }
  } catch(e){
    err.textContent = e.message || "Sai email hoặc mật khẩu";
    document.getElementById("login-pass").value = "";
    document.getElementById("login-pass").classList.add("input-error");
    setTimeout(() => document.getElementById("login-pass").classList.remove("input-error"), 1500);
  }
}

function doGuest() { _saveSession(null); localStorage.setItem("guest_mode","1"); startApp("user"); }

    const sess = await supaSignIn(u, p);

// ── Count-up animation ──────────────────────────────────────
function countUp(id, target, duration) {
  const el = document.getElementById(id);
  if (!el) return;
  const prev = parseInt(el.textContent) || 0;
  if (prev === target) return; // no change, skip
  const start = performance.now();
  const diff = target - prev;
  el.classList.add('counting');
  function step(now) {
    const elapsed = now - start;
    const progress = Math.min(elapsed / duration, 1);
    // easeOutExpo
    const ease = progress === 1 ? 1 : 1 - Math.pow(2, -10 * progress);
    el.textContent = Math.round(prev + diff * ease);
    if (progress < 1) {
      requestAnimationFrame(step);
    } else {
      el.textContent = target;
      el.classList.remove('counting');
      el.classList.add('bump');
      el.addEventListener('animationend', () => el.classList.remove('bump'), { once: true });
    }
  }
  requestAnimationFrame(step);
}

function updateStats(records) {
  countUp('stat-total',     records.length,                                       700);
  countUp('stat-active',    records.filter(r=>r.trang_thai==="Active").length,    750);
  countUp('stat-inactive',  records.filter(r=>r.trang_thai==="Inactive").length,  800);
  countUp('stat-probation', records.filter(r=>r.trang_thai==="Probation").length, 850);
}

const AV_COLORS = ["av-blue","av-purple","av-green","av-orange","av-pink","av-teal"];

function getInitials(name) {
  if (!name) return "?";
  const parts = name.trim().split(" ");
  if (parts.length===1) return parts[0][0].toUpperCase();
  return (parts[parts.length-2][0] + parts[parts.length-1][0]).toUpperCase();
}

function avColor(name) {
  let h=0; for(let c of (name||"")) h=(h*31+c.charCodeAt(0))%AV_COLORS.length;
  return AV_COLORS[Math.abs(h)%AV_COLORS.length];
}

function statusBadge(s) {
  if (!s) return "";
  const cls = s==="Active"?"status-active":s==="Inactive"?"status-inactive":"status-probation";
  return `<span class="status-badge ${cls}">${s}</span>`;
}

function renderList(records) {
  const el = document.getElementById("list-content");
  if (!records.length) {
    el.innerHTML = `<div class="empty-state">

      <div class="empty-sub">Thử thay đổi bộ lọc hoặc từ khóa tìm kiếm</div>

    return;
  }
  el.innerHTML = records.map((r,i) => {
    const ini = getInitials(r.ho_ten);
    const cls = avColor(r.ho_ten);
    const dept = [r.bo_phan, r.co_so].filter(Boolean).join(" · ");

    return `<div class="emp-card" onclick="viewDetail(${r.id})" ontouchstart="" style="animation-delay:${delay}ms;">
      <div class="emp-avatar ${cls}"><span>${ini}</span></div>
      <div class="emp-info">

        </div>

  }).join("");
}

// ============================================================
// NAV — enhanced with ripple + particle burst
// ============================================================

function navSpawnRipple(btn, e) {
  const rect = btn.getBoundingClientRect();
  const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
  const y = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
  const size = Math.max(rect.width, rect.height) * 1.4;
  const ripple = document.createElement("span");
  ripple.className = "nav-ripple";
  ripple.style.cssText = `width:${size}px;height:${size}px;left:${x - size/2}px;top:${y - size/2}px;`;
  btn.appendChild(ripple);
  ripple.addEventListener("animationend", () => ripple.remove());
}

function navSpawnParticles(btn) {
  const wrap = btn.querySelector(".nav-icon-wrap");
  if (!wrap) return;
  const rect = wrap.getBoundingClientRect();
  const cx = rect.left + rect.width/2;
  const cy = rect.top + rect.height/2;
  const colors = ["#3B82F6","#8B5CF6","#06B6D4","#60a5fa","#a5f3fc"];
  for (let i = 0; i < 8; i++) {
    const dot = document.createElement("div");
    const angle = (i / 8) * Math.PI * 2;
    const dist = 18 + Math.random() * 14;
    const dx = Math.cos(angle) * dist;
    const dy = Math.sin(angle) * dist;
    const color = colors[i % colors.length];
    const size = 3 + Math.random() * 2.5;
    dot.style.cssText = `
      position:fixed;z-index:9999;
      width:${size}px;height:${size}px;border-radius:50%;
      background:${color};
      left:${cx}px;top:${cy}px;
      pointer-events:none;
      box-shadow:0 0 ${size+2}px ${color};
      transition: transform 0.45s cubic-bezier(0.22,1,0.36,1), opacity 0.45s ease;
      transform:translate(-50%,-50%);
      opacity:1;
    `;
    document.body.appendChild(dot);
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        dot.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(0)`;
        dot.style.opacity = "0";
      });
    });
    setTimeout(() => dot.remove(), 500);
  }
}

function navActivate(btnEl) {
  const wasActive = btnEl.classList.contains("active");
  document.querySelectorAll(".nav-btn").forEach(b => b.classList.remove("active"));
  btnEl.classList.add("active");
  if (!wasActive) {
    navSpawnParticles(btnEl);
    // Re-trigger bounce by removing and re-adding class
    const svg = btnEl.querySelector("svg");
    if (svg) {
      svg.style.animation = "none";
      svg.offsetHeight; // reflow
      svg.style.animation = "";
    }
    const label = btnEl.querySelector(".nav-label");
    if (label) {
      label.style.animation = "none";
      label.offsetHeight;
      label.style.animation = "";
    }
  }
}

// Attach ripple to all nav buttons
document.addEventListener("DOMContentLoaded", () => {
  document.querySelectorAll(".nav-btn").forEach(btn => {
    const handler = (e) => {
      if (btn.style.display === "none" || btn.style.display.includes("!important")) return;
      navSpawnRipple(btn, e);
    };
    btn.addEventListener("mousedown", handler);
    btn.addEventListener("touchstart", handler, {passive:true});
  });
});

function navTo(t) {
  if (t==="list") {
    navActivate(document.getElementById("nav-list"));
  } else if (t==="laptop") {
    navActivate(document.getElementById("nav-laptop"));
  } else if (t==="account") {
    navActivate(document.getElementById("nav-account"));
  } else if (t==="add") {
    showAddForm();
  }
}

function validateForm(p) {
  const errs = [];
  if (!p.ho_ten) errs.push("Họ và tên không được để trống");
  if (!p.chuc_danh) errs.push("Chức danh không được để trống");
  if (!p.email) errs.push("Email không được để trống");
  else if (!/[^@]+@[^@]+\.[^@]+/.test(p.email)) errs.push("Email không hợp lệ");
  if (p.sdt && !/^\d{9,12}$/.test(p.sdt)) errs.push("SĐT phải từ 9–12 chữ số");
  return errs;
}

async function saveNew() {
  const p = getFormPayload();
  const errs = validateForm(p);
  if (errs.length) { showFormError(errs[0]); return; }
  setBtnLoading("save-btn", true);
  try {
    const inserted = await dbInsert(p);
    try {
      const row = Array.isArray(inserted) ? inserted[0] : inserted;
      await syncStatusToAttendance(row?.ho_ten || p.ho_ten, row?.trang_thai || p.trang_thai);
    } catch(_) {}
    closeModal();
    toast("Thêm nhân sự thành công", "success");
    loadData();
  } catch(e) {
    showFormError("Lỗi: " + e.message);
    setBtnLoading("save-btn", false);
  }
}

async function saveEdit(id) {
  const p = getFormPayload();
  const errs = validateForm(p);
  if (errs.length) { showFormError(errs[0]); return; }
  // Lưu trạng thái cũ trước khi update
  const oldRecord = allRecords.find(x=>x.id===id);
  const wasActive = oldRecord && oldRecord.trang_thai !== "Inactive";
  try {
    await dbUpdate(id, p);
    try { await syncStatusToAttendance(p.ho_ten, p.trang_thai); } catch(_) {}
    // Nếu vừa chuyển sang Inactive → tự động xử lý tài khoản & thiết bị
    if (wasActive && p.trang_thai === "Inactive" && p.tai_khoan) {
      try { await handleInactiveEmployee(p.tai_khoan); } catch(e) {
        console.warn("[inactive] Lỗi xử lý tự động:", e);
      }
    }
    closeModal();
    if (wasActive && p.trang_thai === "Inactive") {
      toast("Đã chuyển Inactive — Tài khoản & Thiết bị đã được cập nhật tự động ✅", "success");
    } else {
      toast("Cập nhật thành công", "success");
    }
    loadData();
  } catch(e) {
    showFormError("Lỗi: " + e.message);
  }
}

async function handleInactiveEmployee(heiway_account) {
  const ts = new Date().toISOString();
  const enc = encodeURIComponent(heiway_account);

  // --- 1. TAI KHOAN ---
  // Tim tat ca account khop heiway_account, KHONG loc status de khong bo sot
  // Chi xu ly nhung record chua phai Returned/Backup
  let accRows = [];
  try {
    const r = await fetch(
      _urlAcc(`?heiway_account=eq.${enc}&status=not.in.(Returned,Backup)`),
      { headers: _h() }
    );
    if (r.ok) accRows = await r.json();
  } catch(e) { console.warn("[inactive] fetch acc error:", e); }

  for (const acc of accRows) {
    // Ban goc: CHI doi status -> Returned, GIU NGUYEN pic_name, job_title, note
    try {
      await apiUpdate(_urlAcc, acc.id, { status: "Returned", updated_at: ts });
    } catch(e) { console.warn("[inactive] update acc error:", e); }
    // Tao ban Backup moi: giu heiway_account, cac field nguoi dung de trong
    try {
      const nextStt = (allAccounts.reduce((m,r)=>Math.max(m,r.stt||0),0) + 10) || 1;
      await apiInsert(_urlAcc, {
        heiway_account: acc.heiway_account,
        pic_name: null, job_title: null, status: "Backup", note: null, stt: nextStt,
      });
    } catch(e) { console.warn("[inactive] insert acc backup error:", e); }
  }

  // --- 2. THIET BI ---
  // Tim theo heiway_account, KHONG loc status de bat dung thiet bi
  // Chi xu ly record chua phai Returned/Backup
  let lapRows = [];
  try {
    const r = await fetch(
      _urlLap(`?heiway_account=eq.${enc}&status=not.in.(Returned,Backup)`),
      { headers: _h() }
    );
    if (r.ok) lapRows = await r.json();
  } catch(e) { console.warn("[inactive] fetch lap error:", e); }

  for (const lap of lapRows) {
    // Ban goc: CHI doi status -> Returned, GIU NGUYEN toan bo thong tin cu
    try {
      await apiUpdate(_urlLap, lap.id, {
        status: "Returned",
        updated_at: ts,
      });
    } catch(e) { console.warn("[inactive] update lap error:", e); }
    // Tao ban Backup moi: giu thong tin phan cung, cac field nguoi dung de trong
    try {
      const nextStt = (allLaptops.reduce((m,r)=>Math.max(m,r.stt||0),0) + 10) || 1;
      await apiInsert(_urlLap, {
        serial_number: lap.serial_number,
        laptop_drive_c: lap.laptop_drive_c,
        wlan_guest: lap.wlan_guest,
        status: "Backup",
        name: null, heiway_account: null, job_title: null, note: null,
        bien_ban_url: null, bien_ban_files: null,
        stt: nextStt,
      });
    } catch(e) { console.warn("[inactive] insert lap backup error:", e); }
  }

  // Cap nhat local cache va re-render tab dang mo
  try { const rows = await apiList(_urlLap,"","",LAP_FIELDS); allLaptops = rows; } catch(_){}
  try { const rows = await apiList(_urlAcc,"","",ACC_FIELDS); allAccounts = rows; } catch(_){}
  if (currentTab === "laptop")  { try { renderLapList(allLaptops); updateLapStats(allLaptops); } catch(_){} }
  if (currentTab === "account") { try { renderAccList(allAccounts); updateAccStats(allAccounts); } catch(_){} }
}

// ============================================================
// AURORA PARTICLE ANIMATION
// ============================================================
(function() {
  const canvas = document.createElement('canvas');
  canvas.id = 'aurora-canvas';
  canvas.style.cssText = 'position:fixed;inset:0;z-index:0;pointer-events:none;opacity:0.5;';
  document.body.insertBefore(canvas, document.body.firstChild);
  const ctx = canvas.getContext('2d');
  let W, H, particles = [], animId;
  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  class Particle {
    constructor() { this.reset(true); }
    reset(init) {
      this.x = Math.random() * W;
      this.y = init ? Math.random() * H : H + 20;
      this.r = Math.random() * 2.5 + 0.5;
      this.vy = -(Math.random() * 0.4 + 0.1);
      this.vx = (Math.random() - 0.5) * 0.3;
      this.alpha = 0;
      this.maxAlpha = Math.random() * 0.4 + 0.1;
      this.fadeIn = true;
      const palettes = [
        [59,130,246],[139,92,246],[6,182,212],[16,185,129]
      ];
      this.color = palettes[Math.floor(Math.random() * palettes.length)];
    }
    update() {
      this.x += this.vx; this.y += this.vy;
      if (this.fadeIn) {
        this.alpha = Math.min(this.alpha + 0.005, this.maxAlpha);
        if (this.alpha >= this.maxAlpha) this.fadeIn = false;
      } else {
        this.alpha -= 0.001;
      }
      if (this.alpha <= 0 || this.y < -20) this.reset(false);
    }
    draw() {
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(${this.color[0]},${this.color[1]},${this.color[2]},${this.alpha})`;
      ctx.fill();
    }
  }
  for (let i = 0; i < 60; i++) particles.push(new Particle());

  function animate() {
    ctx.clearRect(0, 0, W, H);
    particles.forEach(p => { p.update(); p.draw(); });
    animId = requestAnimationFrame(animate);
  }
  animate();
})();

// --- API ---
async function apiList(urlFn, kw, filter, fields) {
  const parts = [];
  const k = (kw||"").trim();
  if (k) parts.push(`or=(${fields.map(f=>`${f}.ilike.*${k}*`).join(",")})`);
  if (filter && filter!=="All") parts.push(`status=eq.${encodeURIComponent(filter)}`);
  parts.push("order=stt.asc.nullslast,id.asc");
  const r = await fetch(urlFn("?"+parts.join("&")), {headers:_h()});
  if (!r.ok) throw new Error("HTTP "+r.status);
  return r.json();
}
async function apiInsert(urlFn, data) {
  const r = await fetch(urlFn(), {method:"POST", headers:_h(), body:JSON.stringify(data)});
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}
async function apiUpdate(urlFn, id, data) {
  const r = await fetch(urlFn(`?id=eq.${id}`), {method:"PATCH", headers:_h(), body:JSON.stringify(data)});
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}
async function apiDelete(urlFn, id) {
  const r = await fetch(urlFn(`?id=eq.${id}`), {method:"DELETE", headers:_h()});
  if (!r.ok) throw new Error(await r.text());
}

    'In Used': `<svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" width="28" height="28">

        .lap-body{fill:currentColor;fill-opacity:.13;}
        .lap-screen{fill:currentColor;fill-opacity:.22;}

      <rect x="5" y="7" width="22" height="12" rx="1.5" fill="currentColor" fill-opacity=".12"/>

    'Returned': `<svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" width="28" height="28">

  const diClass = { 'In Used':'di-inused', 'Backup':'di-backup' };

  el.innerHTML = rows.map((r,i)=>{

function updateLapStats(rows) {
  countUp('lap-stat-total',  rows.length,                                                          700);
  countUp('lap-stat-inuse',  rows.filter(r=>r.status==="In Used").length,                          750);
  countUp('lap-stat-backup', rows.filter(r=>r.status==="Backup").length,                           800);
  countUp('lap-stat-other',  rows.filter(r=>!["In Used","Backup"].includes(r.status)).length,      850);
}
async function loadLaptops() {
  setConnDot("loading");
  try {
    const kw = document.getElementById("lap-search").value;
    const rows = await apiList(_urlLap, kw, lapFilter, LAP_FIELDS);
    allLaptops = rows; renderLapList(rows); updateLapStats(rows);
    setConnDot("ok");
  } catch(e) { setConnDot("err"); document.getElementById("lap-list").innerHTML = `<div class="empty-state"><div class="empty-icon">⚠️</div><div class="empty-title">Lỗi tải</div><div class="empty-sub" style="color:#ff6b63;">${e.message}</div></div>`; }
}
function setLapFilter(f){ lapFilter=f; document.querySelectorAll('[id^="lap-pill-"]').forEach(p=>p.classList.remove("active")); document.getElementById(`lap-pill-${f}`)?.classList.add("active"); loadLaptops(); }
function onSearchLap(){ if(lapSearchT) clearTimeout(lapSearchT); lapSearchT=setTimeout(loadLaptops,350); }

  const r = allLaptops.find(x=>x.id===id); if(!r) return;
  const isAdmin = currentRole==="admin";
  const rows = [
    ["Tên", r.name],
    ["Heiway Account", r.heiway_account],
    ["Serial Number", r.serial_number],
    ["Laptop (Drive C)", r.laptop_drive_c],
    ["WLAN / GUEST", r.wlan_guest],

    ["Status", r.status],

function delLap(id){
  const r = allLaptops.find(x=>x.id===id); if(!r) return;
  showConfirm("Xóa thiết bị?", r.name||"", async ()=>{
    try { await apiDelete(_urlLap, id); closeModal(); toast("Đã xóa","success"); loadLaptops(); }
    catch(e){ toast("Lỗi: "+e.message,"error"); }
  });
}

// Upload biên bản lên Supabase Storage bucket "bien-ban" (public)
async function uploadBienBan(file, ownerKey){
  const ext = (file.name.split(".").pop()||"bin").toLowerCase().replace(/[^a-z0-9]/g,"") || "bin";
  const safe = (ownerKey||"unknown").toString().replace(/[^a-zA-Z0-9_-]/g,"_").slice(0,40);
  const path = `${safe}/${Date.now()}_${Math.random().toString(36).slice(2,8)}.${ext}`;
  const url = `${SUPABASE_URL}/storage/v1/object/bien-ban/${path}`;
  const res = await fetch(url, {
    method: "POST",
    headers: {
      "apikey": SUPABASE_KEY,
      "Authorization": `Bearer ${_bearer()}`,
      "Content-Type": file.type || "application/octet-stream",
      "x-upsert": "true",
    },
    body: file,
  });
  if (!res.ok) { const t = await res.text().catch(()=> ""); throw new Error("Upload thất bại: "+(t||res.status)); }
  return `${SUPABASE_URL}/storage/v1/object/public/bien-ban/${path}`;
}
async function _maybeUploadBB(ownerKey){
  const fi = document.getElementById("lf-bb-file");
  const f = fi?.files?.[0];
  if (!f) return null;
  if (f.size > 15*1024*1024) throw new Error("File quá lớn (>15MB)");
  toast("Đang tải biên bản...","success");
  const url = await uploadBienBan(f, ownerKey);
  return { url, name: f.name, uploaded_at: new Date().toISOString() };
}

async function saveLap(id){
  const data = readLapForm();
  if (!data.name) { toast("Vui lòng nhập tên","error"); return; }
  try {
    const newFile = await _maybeUploadBB(data.heiway_account || data.name);
    if (newFile) {
      // Append new file to existing list
      let files = [];
      try { if(data.bien_ban_files) files = JSON.parse(data.bien_ban_files); } catch(e){}
      if(!Array.isArray(files)) files = [];
      // Migrate legacy bien_ban_url
      if(data.bien_ban_url && !files.some(f=>f.url===data.bien_ban_url)){
        files = [{url:data.bien_ban_url, name:data.bien_ban_url.split("/").pop().split("?")[0], uploaded_at:null}, ...files];
      }
      files.push(newFile);
      data.bien_ban_files = JSON.stringify(files);
      data.bien_ban_url = newFile.url; // keep latest as bien_ban_url for compat
    }
    await apiUpdate(_urlLap, id, {...data, updated_at:new Date().toISOString()});
    closeModal(); toast("Đã lưu","success"); loadLaptops();
  } catch(e){ toast("Lỗi: "+e.message,"error"); }
}

// Tải file biên bản về máy — hoạt động cả trên iPhone shortcut (standalone PWA)
function isStandalone(){
  return (window.navigator.standalone === true) ||
         window.matchMedia('(display-mode: standalone)').matches;
}
async function downloadBienBan(url, filename){
  try {
    if(!url){ toast("Không có file","error"); return; }
    const ext = (url.split("?")[0].split(".").pop() || "bin").toLowerCase();
    const safeName = (filename || "bien-ban").replace(/[^\w\-]+/g,"_");
    const fullName = safeName.endsWith("."+ext) ? safeName : (safeName+"."+ext);
    const sep = url.includes("?") ? "&" : "?";
    const dlUrl = url + sep + "download=" + encodeURIComponent(fullName);

    toast("Đang tải file...","success");

    // ===== iOS (Safari + Home Screen shortcut/PWA) =====
    if (isIOS()) {
      // Cách 1: thử fetch blob rồi dùng Web Share API (iOS 15+) → lưu vào Files
      try {
        const res = await fetch(dlUrl, { mode: "cors" });
        if(!res.ok) throw new Error("HTTP "+res.status);
        const blob = await res.blob();
        const file = new File([blob], fullName, { type: blob.type || "application/octet-stream" });

        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          await navigator.share({ files: [file], title: fullName });
          return;
        }

        // Cách 2: mở blob trong tab mới — iOS Safari sẽ hiện nút Share/Save to Files
        const objUrl = URL.createObjectURL(blob);
        const win = window.open(objUrl, "_blank");
        if (!win) {
          // Standalone không mở được tab → tạo link tạm cho user bấm
          const a = document.createElement("a");
          a.href = objUrl; a.target = "_blank"; a.rel = "noopener";
          a.download = fullName;
          document.body.appendChild(a); a.click(); a.remove();
        }
        setTimeout(()=>URL.revokeObjectURL(objUrl), 60000);
        return;
      } catch(err){
        console.warn("iOS blob fail, fallback navigate:", err);
        // Cách 3 (cuối cùng): nếu đang standalone, mở Safari thật qua link _blank
        if (isStandalone()) {
          const a = document.createElement("a");
          a.href = dlUrl; a.target = "_blank"; a.rel = "noopener";
          document.body.appendChild(a); a.click(); a.remove();
        } else {
          window.location.href = dlUrl;
        }
        return;
      }
    }

    // ===== Desktop / Android =====
    try {
      const res = await fetch(dlUrl);
      if(!res.ok) throw new Error("HTTP "+res.status);
      const blob = await res.blob();
      const objUrl = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = objUrl; a.download = fullName; a.style.display = "none";
      document.body.appendChild(a); a.click();
      setTimeout(()=>{ a.remove(); URL.revokeObjectURL(objUrl); }, 1500);
    } catch(_){
      window.location.href = dlUrl;
    }
  } catch(e){ toast("Không tải được: "+e.message,"error"); }
}

// --- Top Add button: label + visibility per tab ---
function updateTopAddBtn(){
  const btn = document.getElementById("top-add-btn");
  const lbl = document.getElementById("top-add-label");
  if (!btn || !lbl) return;
  const isAdmin = currentRole === "admin";
  const map = {
    list:    "Thêm nhân sự",
    laptop:  "Thêm thiết bị",
    account: "Thêm tài khoản",
  };
  const tab = (typeof currentTab !== "undefined" && currentTab) ? currentTab : "list";
  if (isAdmin && map[tab]) {
    lbl.textContent = map[tab];
    btn.style.display = "inline-flex";
  } else {
    btn.style.display = "none";
  }
}
function onTopAddClick(){
  const tab = (typeof currentTab !== "undefined" && currentTab) ? currentTab : "list";
  if (tab === "laptop")  { addLap(); return; }
  if (tab === "account") { addAcc(); return; }
  showAddForm();
}

// --- Tab switching (override navTo) ---
const _origNavTo = window.navTo;
window.navTo = function(t){
  if (t==="add") { onTopAddClick(); return; }
  currentTab = t;
  document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));
  if (t==="list")    { document.getElementById("view-employee").classList.add("active"); navActivate(document.getElementById("nav-list")); loadData(false); }
  if (t==="laptop")  { document.getElementById("view-laptop").classList.add("active");   navActivate(document.getElementById("nav-laptop")); loadLaptops(); }
  if (t==="account") { document.getElementById("view-account").classList.add("active"); navActivate(document.getElementById("nav-account")); loadAccounts(); }
  updateTopAddBtn();
};

// --- Hook into setupRoleUI to also re-evaluate Add button visibility on tab switch ---
const _origSetupRole = window.setupRoleUI;
window.setupRoleUI = function(){
  _origSetupRole();
  updateTopAddBtn();
};
